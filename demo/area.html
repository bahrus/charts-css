<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css-charts — area</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
        import 'imp-h/imp-h.js';
        import 'el-maker/def.js';
    </script>
</head>
<body>
    <be-hive></be-hive>
    <css-charts imp-h="css-charts/root.html" chart-type=area show-labels show-primary-axis show-data-axes>
        <script type=precede data-extends=el-maker src="css-charts/el-maker.json"></script>
        <table>
            <caption> Progress Example </caption>
            <thead>
                <tr><th scope="col">Year</th><th scope="col">Progress</th></tr>
            </thead>
            <tbody>
                <tr itemscope><th itemprop="key">2016</th><td><data itemprop="value" value="20"></data></td></tr>
                <tr itemscope><th itemprop="key">2017</th><td><data itemprop="value" value="40"></data></td></tr>
                <tr itemscope><th itemprop="key">2018</th><td><data itemprop="value" value="60"></data></td></tr>
                <tr itemscope><th itemprop="key">2019</th><td><data itemprop="value" value="80"></data></td></tr>
                <tr itemscope><th itemprop="key">2020</th><td><data itemprop="value" value="100"></data></td></tr>
            </tbody>
        </table>
    </css-charts>
</body>
</html>
